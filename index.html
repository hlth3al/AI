<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پنل فرماندهی هوش مصنوعی - حسین لعلیان</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body {
            background: radial-gradient(circle at 50% 30%, #151a2e 0%, #080a10 100%);
            color: #fff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            min-height: 100vh;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            padding: 20px; overflow-x: hidden;
        }
        .card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(0,255,200,0.25);
            box-shadow: 0 0 35px rgba(0,255,200,0.12), inset 0 0 20px rgba(0,255,200,0.05);
            border-radius: 24px; padding: 30px 24px;
            max-width: 440px; width: 100%; text-align: center;
            backdrop-filter: blur(12px); position: relative;
        }
        .badge {
            display: inline-block; padding: 6px 14px;
            background: rgba(0,255,200,0.1); border: 1px solid rgba(0,255,200,0.3);
            color: #00ffc8; font-size: 12px; letter-spacing: 1px;
            border-radius: 50px; margin-bottom: 16px; text-transform: uppercase;
        }
        h1 {
            font-size: 22px; font-weight: 800; margin-bottom: 10px;
            background: linear-gradient(135deg, #ffffff 40%, #00ffc8 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        p.subtitle { font-size: 13px; color: #8fa0b5; line-height: 1.6; margin-bottom: 28px; }
        .btn-launch {
            position: relative;
            background: linear-gradient(135deg, #00ffc8 0%, #0099ff 100%);
            color: #050a14; border: none; padding: 16px 32px;
            font-size: 16px; font-weight: 800; border-radius: 14px;
            cursor: pointer; box-shadow: 0 0 25px rgba(0,255,200,0.45);
            transition: all 0.25s ease; width: 100%;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }
        .btn-launch:active { transform: scale(0.97); box-shadow: 0 0 15px rgba(0,255,200,0.3); }
        .status-dot { width: 10px; height: 10px; background: #050a14; border-radius: 50%; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0%,100% { opacity:1; transform: scale(1); } 50% { opacity:0.4; transform: scale(0.8); } }
        .footer { margin-top: 24px; font-size: 11px; color: #556275; letter-spacing: 0.5px; }

        .video-overlay {
            display: none; position: fixed; top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0,0,0,0.88); backdrop-filter: blur(16px);
            z-index: 9999; justify-content: center; align-items: center;
            flex-direction: column; padding: 16px;
        }
        .video-overlay.active { display: flex; }
        .player-card {
            background: rgba(18,24,38,0.95);
            border: 1px solid rgba(0,255,200,0.4);
            border-radius: 20px; padding: 16px;
            max-width: 400px; width: 100%;
            display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 30px rgba(0,255,200,0.2);
            animation: popIn 0.3s cubic-bezier(0.175,0.885,0.32,1.275);
        }
        @keyframes popIn { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .player-header {
            width: 100%; display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; padding-bottom: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .player-title { font-size: 13px; color: #00ffc8; font-weight: 700; }
        .btn-close {
            background: rgba(255,50,80,0.2); border: 1px solid rgba(255,50,80,0.5);
            color: #ff5277; padding: 6px 14px; border-radius: 8px;
            font-size: 12px; font-weight: 700; cursor: pointer; transition: 0.2s;
        }
        .btn-close:active { background: rgba(255,50,80,0.5); color: #fff; }
        video { width: 100%; max-height: 65vh; border-radius: 12px; background: #000; outline: none; }
        .close-hint { margin-top: 10px; font-size: 11px; color: #7b8a9e; }
    </style>
</head>
<body>

    <div class="card">
        <div class="badge">Venture.AI // Live Demo</div>
        <h1>درگاه اختصاصی هوش مصنوعی</h1>
        <p class="subtitle">سیستم فرماندهی خودکار الگوریتم‌های بلستیک<br>توسعه‌یافته توسط حسین لعلیان</p>

        <button class="btn-launch" id="btnLaunch" onclick="playVideo()">
            <span class="status-dot"></span>
            <span>مشاهده نمایش زنده (دِمو)</span>
        </button>

        <div class="footer">
            DEVELOPER: HOSSEIN LAALIYAN<br>
            GITHUB: @hlth3al
        </div>
    </div>

    <div class="video-overlay" id="videoOverlay" onclick="handleBackdropClick(event)">
        <div class="player-card" id="playerCard">
            <div class="player-header">
                <span class="player-title">▶ در حال پخش ویدیوی دِمو</span>
                <button class="btn-close" onclick="stopVideo()">✕ قطع و بستن</button>
            </div>

            <video id="demoVideo" controls playsinline preload="metadata">
                <source src="demo.mp4" type="video/mp4">
                مرورگر شما از پخش این ویدیو پشتیبانی نمی‌کند.
            </video>

            <div class="close-hint">برای توقف کامل ویدیو دکمه «قطع و بستن» را بزنید</div>
        </div>
    </div>

    <script>
        const overlay = document.getElementById('videoOverlay');
        const video = document.getElementById('demoVideo');

        function playVideo() {
            overlay.classList.add('active');
            video.currentTime = 0;
            video.play().catch(e => console.log('Autoplay prevented:', e));
        }

        function stopVideo() {
            video.pause();
            video.currentTime = 0;
            overlay.classList.remove('active');
        }

        function handleBackdropClick(e) {
            if (e.target === overlay) { stopVideo(); }
        }
    </script>
</body>
</html>
