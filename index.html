<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>درگاه سرمایه‌گذاری هوش مصنوعی | حسین لعلیان</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #030712;
            --card-bg: rgba(15, 23, 42, 0.82);
            --neon-blue: #00f0ff;
            --neon-pink: #ff007f;
            --neon-gold: #ffd700;
            --neon-emerald: #00ffaa;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            font-family: 'Vazirmatn', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            overflow-x: hidden;
            position: relative;
        }

        /* پس‌زمینه شبکه‌ای مدرن */
        body::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: 
                radial-gradient(circle at 50% 20%, rgba(0, 240, 255, 0.12) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(255, 0, 127, 0.08) 0%, transparent 40%),
                linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
            z-index: 0;
            pointer-events: none;
        }

        /* کانتینر کارت با کادر متحرک رنگین‌کمانی */
        .portal-card {
            position: relative;
            width: 100%;
            max-width: 520px;
            background: var(--card-bg);
            border-radius: 28px;
            padding: 40px 28px;
            text-align: center;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85);
            z-index: 1;
            overflow: hidden;
        }

        .portal-card::before {
            content: "";
            position: absolute;
            inset: -2px;
            border-radius: 30px;
            padding: 2px;
            background: linear-gradient(135deg, var(--neon-blue), var(--neon-pink), var(--neon-emerald), var(--neon-gold), var(--neon-blue));
            background-size: 300% 300%;
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: rainbowBorder 7s ease infinite;
            pointer-events: none;
        }

        @keyframes rainbowBorder {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* محفظه تصویر مغز همراه با هاله چرخان */
        .brain-wrapper {
            position: relative;
            width: 170px;
            height: 170px;
            margin: 0 auto 24px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brain-halo {
            position: absolute;
            inset: -10px;
            border-radius: 50%;
            background: conic-gradient(from 0deg, var(--neon-blue), var(--neon-pink), var(--neon-emerald), var(--neon-gold), var(--neon-blue));
            filter: blur(18px);
            opacity: 0.85;
            animation: rotateHalo 6s linear infinite;
            z-index: 1;
        }

        @keyframes rotateHalo {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .brain-box {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #0b1329;
            border: 2px solid rgba(0, 240, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            z-index: 2;
            box-shadow: inset 0 0 20px rgba(0, 240, 255, 0.3);
        }

        .brain-box img {
            width: 82%;
            height: 82%;
            object-fit: contain;
            filter: drop-shadow(0 0 10px rgba(0, 240, 255, 0.7));
            transition: transform 0.4s ease;
        }

        .brain-wrapper:hover .brain-box img {
            transform: scale(1.08);
        }

        /* تایپوگرافی */
        h1 {
            font-size: 1.45rem;
            font-weight: 900;
            color: #ffffff;
            text-shadow: 0 0 14px rgba(0, 240, 255, 0.6);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 1.15rem;
            color: var(--neon-gold);
            font-weight: 700;
            text-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
            margin-bottom: 22px;
        }

        /* کارت ایمیل ارتباطی */
        .info-card {
            background: rgba(2, 6, 23, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 14px 18px;
            margin-bottom: 24px;
        }

        .info-card .label {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .info-card a {
            direction: ltr;
            display: inline-block;
            color: var(--neon-blue);
            font-size: 0.95rem;
            font-weight: 700;
            text-decoration: none;
            transition: color 0.25s, text-shadow 0.25s;
        }

        .info-card a:hover {
            color: #ffffff;
            text-shadow: 0 0 12px var(--neon-blue);
        }

        /* دکمه اتصال صوتی و نوری */
        .cta-btn {
            width: 100%;
            padding: 16px 20px;
            font-family: inherit;
            font-size: 1.05rem;
            font-weight: 900;
            color: #030712;
            background: linear-gradient(90deg, var(--neon-blue), var(--neon-emerald));
            border: none;
            border-radius: 14px;
            cursor: pointer;
            box-shadow: 0 0 24px rgba(0, 240, 255, 0.45);
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .cta-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 35px rgba(0, 240, 255, 0.75);
            background: linear-gradient(90deg, #38f9d7, var(--neon-blue));
        }

        .cta-btn.active-flash {
            background: #ffffff !important;
            color: #000000 !important;
            box-shadow: 0 0 60px rgba(255, 255, 255, 1), 0 0 100px var(--neon-pink) !important;
            transform: scale(0.98);
        }

        .footer-quote {
            margin-top: 24px;
            font-size: 0.85rem;
            color: #64748b;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="portal-card">
        <div class="brain-wrapper">
            <div class="brain-halo"></div>
            <div class="brain-box">
                <img src="ai_brain.png" alt="هوش مصنوعی" onerror="this.src='https://raw.githubusercontent.com/hlth3al/AI/main/ai_brain.png'">
            </div>
        </div>

        <h1>شرکت صنایع پردرآمد تهرانی‌ها</h1>
        <div class="subtitle">مدیرعامل: حسین لعلیان</div>

        <div class="info-card">
            <div class="label">واحد پذیرش و سرمایه‌گذاری الگوریتم‌ها</div>
            <a href="mailto:AI.Algorithms.Ballistics@gmail.com">AI.Algorithms.Ballistics@gmail.com</a>
        </div>

        <button class="cta-btn" id="connectBtn" onclick="handleConnect()">
            ورود به درگاه هوشمند
        </button>

        <p class="footer-quote">
            توسعه زیرساخت‌های محاسباتی و الگوریتم‌های پیشرفته ملی
        </p>
    </div>

    <script>
        // تولید صدای بوق بسیار نرم (Web Audio API) بدون نیاز به فایل صوتی
        function playSoftBeep() {
            try {
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (!AudioContext) return;
                const ctx = new AudioContext();

                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'sine';
                
                // فرکانس صعودی و ملایم (از ۵۸۷ هرتز به ۸۸۰ هرتز)
                osc.frequency.setValueAtTime(587.33, ctx.currentTime); 
                osc.frequency.exponentialRampToValueAtTime(880.00, ctx.currentTime + 0.16);

                gain.gain.setValueAtTime(0.001, ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.18, ctx.currentTime + 0.04);
                gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.32);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start();
                osc.stop(ctx.currentTime + 0.35);
            } catch (e) {
                console.log("Audio not supported or blocked");
            }
        }

        function handleConnect() {
            const btn = document.getElementById('connectBtn');
            btn.classList.add('active-flash');
            btn.innerText = 'در حال برقراری اتصال امن...';

            playSoftBeep();

            setTimeout(() => {
                window.location.href = 'https://hlth3al.github.io/Hossein-Laaliyan-AI/';
            }, 550);
        }
    </script>
</body>
</html>
