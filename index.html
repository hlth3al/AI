<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>درگاه واگذاری امتیاز سرمایه گذاری پر بازده هوش مصنوعی</title>
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --bg-dark: #060913;
            --card-bg: #0d1424;
            --card-border: #22304a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Vazirmatn', Tahoma, sans-serif;
        }

        body {
            background-color: var(--bg-dark);
            background-image:
                radial-gradient(circle at 15% 25%, rgba(34, 211, 238, 0.18), transparent 45%),
                radial-gradient(circle at 85% 20%, rgba(232, 121, 249, 0.18), transparent 45%),
                radial-gradient(circle at 55% 90%, rgba(52, 211, 153, 0.15), transparent 45%),
                radial-gradient(circle at 5% 80%, rgba(251, 191, 36, 0.12), transparent 40%),
                radial-gradient(circle at 95% 70%, rgba(56, 189, 248, 0.15), transparent 40%),
                linear-gradient(135deg, #0f172a, #1e1b4b, #0f172a);
            background-size: 100% 100%, 100% 100%, 100% 100%, 100% 100%, 100% 100%, 400% 400%;
            animation: gradientShift 14s ease infinite;
            min-height: 100vh;
            color: #e2e8f0;
            line-height: 1.9;
            padding: 25px 15px;
            direction: rtl;
            text-align: center;
            overflow-x: hidden;
            position: relative;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%, 0% 50%, 50% 50%, 0% 50%, 100% 50%, 0% 50%; }
            50% { background-position: 100% 50%, 100% 50%, 50% 50%, 100% 50%, 0% 50%, 100% 50%; }
            100% { background-position: 0% 50%, 0% 50%, 50% 50%, 0% 50%, 100% 50%, 0% 50%; }
        }

        /* ذرات نورانی شناور پس‌زمینه */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
            pointer-events: none;
        }

        .particle {
            position: absolute;
            border-radius: 50%;
            filter: blur(1px);
            opacity: 0;
            animation: floatUp linear infinite;
        }

        @keyframes floatUp {
            0% { transform: translateY(110vh) scale(0); opacity: 0; }
            10% { opacity: 0.8; }
            50% { opacity: 0.5; }
            100% { transform: translateY(-10vh) scale(1.3); opacity: 0; }
        }

        .container {
            max-width: 780px;
            margin: 0 auto;
            position: relative;
            z-index: 2;
        }

        /* 🔥 آیکون مغز هوش مصنوعی شکیل با نورافشانی عظیم */
        .brain-container {
            display: flex;
            justify-content: center;
            margin: 20px 0 25px;
            position: relative;
        }

        .brain-halo {
            position: absolute;
            width: 240px;
            height: 240px;
            border-radius: 50%;
            background: radial-gradient(circle,
                rgba(56, 189, 248, 0.55) 0%,
                rgba(168, 85, 247, 0.45) 35%,
                rgba(34, 211, 238, 0.2) 60%,
                transparent 75%);
            filter: blur(35px);
            animation: haloPulse 3s ease-in-out infinite;
            z-index: -1;
        }

        @keyframes haloPulse {
            0%, 100% { transform: scale(1); opacity: 0.7; }
            50% { transform: scale(1.35); opacity: 1; }
        }

        .brain-stage {
            position: relative;
            width: 210px;
            height: 210px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .brain-core {
            position: absolute;
            width: 175px;
            height: 175px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.3), rgba(124, 58, 237, 0.2) 50%, rgba(15, 23, 42, 0.6));
            filter: blur(8px);
            animation: coreSpin 12s linear infinite;
            box-shadow:
                inset 0 0 30px rgba(56, 189, 248, 0.7),
                0 0 40px rgba(168, 85, 247, 0.6),
                0 0 90px rgba(56, 189, 248, 0.55);
        }

        @keyframes coreSpin {
            0% { transform: rotate(0deg) scale(1); }
            50% { transform: rotate(180deg) scale(1.1); }
            100% { transform: rotate(360deg) scale(1); }
        }

        .brain-svg {
            width: 205px;
            height: 205px;
            position: relative;
            z-index: 2;
            filter: drop-shadow(0 0 35px rgba(56, 189, 248, 0.95)) drop-shadow(0 0 70px rgba(168, 85, 247, 0.75));
        }

        @keyframes brainFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        /* توضیحات پیش‌نمایش */
        .demo-notice {
            color: #cbd5e1;
            font-size: 1rem;
            line-height: 1.8;
            margin: 20px 0;
            padding: 12px;
            background: rgba(15, 23, 42, 0.5);
            border-radius: 10px;
        }

        /* کارت ویژه گی‌ها */
        .feature-item h3 {
            color: #38bdf8;
        }
    </style>
</head>
<body>

    <!-- ذرات نورانی پس‌زمینه -->
    <div class="particles" id="particles"></div>

    <div class="container">

        <!-- 🔥 آیکون مغز هوش مصنوعی نورانی و شکیل -->
        <div class="brain-container">
            <div class="brain-halo"></div>
            <div class="brain-stage">
                <div class="brain-core"></div>
                <svg class="brain-svg" viewBox="0 0 120 120" fill="none" xmlns="http://www.w3.org/2000/svg" style="animation: brainFloat 4s ease-in-out infinite;">
                    <!-- نیم کره راست -->
                    <path d="M60 18C46 18 36 28 36 44C36 56 44 65 52 68C50 73 54 80 60 82V82C66 80 70 73 68 68C76 65 84 56 84 44C84 28 74 18 60 18Z" fill="url(#gradBrain)" stroke="#38bdf8" stroke-width="2.5" filter="url(#glowBrain)"/>
                    <!-- خط میانی -->
                    <line x1="60" y1="18" x2="60" y2="82" stroke="#22d3ee" stroke-width="2" stroke-dasharray="4 4" opacity="0.8"/>
                    <!-- چین های مغز -->
                    <path d="M45 35 Q60 45 75 35" stroke="#60a5fa" stroke-width="2" fill="none" opacity="0.9"/>
                    <path d="M48 48 Q60 55 72 48" stroke="#a78bfa" stroke-width="2" fill="none" opacity="0.9"/>
                    <path d="M48 60 Q60 68 72 60" stroke="#60a5fa" stroke-width="2" fill="none" opacity="0.9"/>
                    <!-- نقاط عصبی نورانی -->
                    <circle cx="45" cy="35" r="3.5" fill="#facc15" filter="url(#glowDot)"/>
                    <circle cx="75" cy="35" r="3.5" fill="#f472b6" filter="url(#glowDot)"/>
                    <circle cx="48" cy="48" r="3" fill="#34d399" filter="url(#glowDot)"/>
                    <circle cx="72" cy="48" r="3" fill="#f472b6" filter="url(#glowDot)"/>
                    <circle cx="60" cy="70" r="4" fill="#22d3ee" filter="url(#glowDot)"/>
                    <!-- تعریف گرادیان و فیلترها -->
                    <defs>
                        <linearGradient id="gradBrain" x1="0" y1="0" x2="1" y2="1">
                            <stop offset="0%" stop-color="#0ea5e9" stop-opacity="0.2"/>
                            <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2"/>
                        </linearGradient>
                        <filter id="glowBrain" x="-50%" y="-50%" width="200%" height="200%">
                            <feGaussianBlur stdDeviation="4" result="blur"/>
                            <feMerge>
                                <feMergeNode in="blur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                        <filter id="glowDot" x="-100%" y="-100%" width="300%" height="300%">
                            <feGaussianBlur stdDeviation="2.5" result="blur"/>
                            <feMerge>
                                <feMergeNode in="blur"/>
                                <feMergeNode in="blur"/>
                                <feMergeNode in="SourceGraphic"/>
                            </feMerge>
                        </filter>
                    </defs>
                </svg>
            </div>
        </div>

        <h1>درگاه واگذاری امتیاز سرمایه گذاری پر بازده پنل‌ها، داشبوردها و پلتفرم‌های هوش مصنوعی</h1>

        <!-- مشخصات شرکت -->
        <div class="info-card" style="background:rgba(15,23,42,0.8);border:1px solid #22304a;border-radius:14px;padding:18px;line-height:1.9;margin:20px 0;">
            <strong>شرکت صنایع پردرآمد تهرانی‌ها</strong><br>
            شرکت هوش مصنوعی ما ایرانی‌ها<br>
            با مدیریت حسین لعلیان (رتبه ۳۲ کنکور دکتری)<br>
            <span style="color:#38bdf8;">AI.Algorithms.Ballistics@gmail.com</span>
        </div>

        <!-- 🔥 دکمه نورافشان با صدای بوق -->
        <button class="btn-glow" onclick="playAiBeep(this)">
            <span class="btn-scan"></span>
            <span class="btn-icon">🤖</span>
            <span class="btn-text">می‌خواهم پلتفرم‌های هوش مصنوعی را ببینم!</span>
        </button>

        <!-- ویژگی‌ها -->
        <div class="features-card" style="text-align:right;background:rgba(15,23,42,0.8);border:1px solid #22304</span>
        </div>

        <!-- 🔥 دکمه نورافشان با صدای بوق -->
        <button class="btn-glow" onclick="playAiBeep(this)">
            <span class="btn-scan"></span>
            <span class="btn-icon">🤖</span>
            <span class="btn-text">می‌خواهم پلتفرم‌های هوش مصنوعی را ببینم!</span>
        </button>

        <!-- ویژگی‌ها -->
        <div class="features-card" style="text-align:right;background:rgba(15,23,42,0.8);border:1px solid #22304a;border-radius:14px;padding:<script>
        /* 🔥 رنگ آمیزی ذرات پس زمینه */
        function createParticles() {
            const container = document.getElementById('particles');
            const colors = ['#38bdf8', '#a855f7', '#f472b6', '#34d399', '#facc15', '#22d3ee'];
            for (let i = 0; i < 40; i++) {
                const dot = document.createElement('div');
                dot.className = 'particle';
                const size = Math.random() * 6 + 3;
                dot.style.left = Math.random() * 100 + '%';
                dot.style.width = size + 'px';
                dot.style.height = size + 'px';
                dot.style.background = colors[Math.floor(Math.random() * colors.length)];
                dot.style.animationDuration = (Math.random() * 8 + 6) + 's';
                dot.style.animationDelay = (Math.random() * 5) + 's';
                container.appendChild(dot);
            }
        }

        /* 🔥 پخش صدای بوق ملایم + نورافشانی دکمه */
        function playAiBeep(btn) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(1460, ctx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.18, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.42);
            } catch(e) {}

            /* نورافشانی قوی هنگام کلیک */
            btn.style.boxShadow = '0 0 50px rgba(56,189,248,0.9), 0 0 90px rgba(168,85,247,0.7)';
            setTimeout(() => { btn.style.boxShadow = ''; }, 600);

            /* باز کردن صفحه مقصد */
            setTimeout(() => {
                window.open('https://hlth3al.github.io/Hossein-Laaliyan-AI/', '_blank');
            }, 400);
        }

        createParticles();
    </script>
</body>
</html>
